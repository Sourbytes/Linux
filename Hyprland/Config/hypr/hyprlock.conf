input-field {
    monitor =
    size = 200, 50
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    inner_color = rgba(30, 30, 30, 0.6)
    font_color = rgba(230, 230, 230, 1.0)
    font_family = Fira Semibold
    outer_color = rgba(160, 160, 160, 1.0)
    outline_thickness = 3
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    rounding = 10
    check_color = rgba(160, 160, 160, 1.0)
    fail_color = rgba(224, 108, 117, 1.0)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -20
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.5)
    shadow_boost = 1.2
}

label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgba(230, 230, 230, 1.0)
    font_size = 70
    font_family = JetBrains Mono Nerd Font
    position = -50, 20
    halign = right
    valign = bottom
    shadow_passes = 2
    shadow_size = 4
}

label {
    monitor =
    text = $USER
    color = rgba(230, 230, 230, 1.0)
    font_size = 20
    font_family = JetBrains Mono Nerd Font
    position = -50, 120
    halign = right
    valign = bottom
    shadow_passes = 2
    shadow_size = 4
}

